[package]
name = "rc-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System sound capture (WASAPI loopback) and a small IMA ADPCM codec for streaming it."

[lib]
name = "rc_audio"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
]

[[example]]
name = "loopback_probe"
path = "examples/loopback_probe.rs"
